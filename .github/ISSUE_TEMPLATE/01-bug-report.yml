name: "Report an Issue"
description: "Create a report for an issue or a bug"
body:
- type: markdown
  attributes:
    value: |
      Thanks for helping improve Reel. Before opening an issue, please check existing issues, including closed ones. If someone has already reported the same problem, add any useful details there instead of opening a duplicate.

- type: input
  attributes:
    label: Reel Version
  validations:
    required: true

- type: dropdown
  attributes:
    label: Release Channel
    options:
      - Release
      - Beta
      - Nightly
      - Other
      - Not Sure
    description: "If \"Other\" is selected, please specify in the Reel version field."
  validations:
    required: true

- type: input
  attributes:
    label: macOS Version
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to Reproduce
    value: |-
      - First step...
      - Second step...
      - ...
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected Behavior
  validations:
    required: true

- type: textarea
  attributes:
    label: Actual Behavior
  validations:
    required: true

- type: textarea
  attributes:
    label: Crash Report or Process Sample
    description: "If you're reporting a crash, please drag and drop the trace log file below. You can find these in ~/Library/Logs/DiagnosticReports/; the filename should be prefixed with Reel and include the crash time. If Reel stops responding, please generate a process sample and attach it here."
    placeholder: Drag and drop the crash report or process sample file here; do not paste the content directly.

- type: textarea
  attributes:
    label: Logs
    description: "If applicable, attach the log files after reproducing the issue. You can enable logging in Settings > Advanced."
    placeholder: Drag and drop the iina.log and mpv.log files here; do not paste the content directly.

- type: textarea
  attributes:
    label: Sample Files
    description: If the issue or bug is related to a specific file/file type (including subtitles), please provide sample files for us to reproduce. Please zip into one file if there are multiple files. For small files, just drag and drop into the text field below. If GitHub reports the file type is not supported, put the file in a zip archive. For larger files, please consider uploading to file hosting services which can be freely accessible by us (e.g. Google Drive, iCloud Drive, etc).
    placeholder: Drag and drop any sample files, or paste the link to the files.

- type: input
  attributes:
    label: How often can you reproduce the issue
  validations:
    required: true

- type: checkboxes
  attributes:
    label: |
      Required Actions
    options:
      - label: I tried my best to search from the existing issues (including closed issues) and didn't find duplicated issues.
        required: true
- type: checkboxes
  attributes:
    label: |
      Optional Actions
    options:
      - label: I tested with the Nightly build and confirmed the issue is not fixed.
      - label: I tested with the latest version of mpv and confirmed mpv doesn't have this issue.
